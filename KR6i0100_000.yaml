body:
  text: 刻淨名疏記序智者淨名經疏部帙廣大與三部殆比駕焉隨部各有荊溪之記猶五經之有正義也但記之為文三部則廣淨名疏則略均是大部而其記有廣略者蓋亦有説三部俱是九旬敷演章安所録不得不略其記須委悉釋成而義意始彰矣此其所以廣解也若淨名疏大師親令侍人筆録是故文廣義備其記止箋釋其難文要義則足矣此其所以略釋也雖廣略不侔然其精揀教門辨明觀道以扶翼宗旨則未初不一致也余曩講疏深見此記妙解巧釋第全書久散逸不得復覩斷簡殘篇僅窺一斑耳近橫川雞頭慈瑗特索諸南都興福果獲全帙而還靈空和尚一見而喜遂使余謀參訂梓行余適病冗交沓不能從事乃囑南溪寶積求公公乃參訂命刻完璧復瑩乎世矣實盛舉也學人苟藉斯記而商究疏文藉斯疏而講求經文則不思議解脫當下薦取與古文殊老毗耶一鼻孔出氣哉爰書數言於卷端為之序云時元文戊午仲冬望日天台山東溪沙門亮潤謹撰刻維摩經疏記辨語智者維摩經疏文古義幽旨趣淵哉大矣故學者窺測實難矣然其所難不在他而在己不在遠而在近也其果難邪其果不難邪欲知其所以實難而得其近在己不難者舍毗陵之記何塗之從惜乎全函流逸存而行者僅斷篇畸册而已蓋天之未喪斯文邪獲復覩全帙實是時也清求謬當拔正之任亦時也不校刊以傳乎但其書乃本國傳寫疑誤不少無二本可校求之浮昧惡能任其事也雖然勉強為之猶賢乎已哉可已而不可已乃遂徵諸世行殘簡與垂裕記中所引用校彼訂此參互仇拔者數矣稍稍得定鉛黃命刻梓人其間尚有疑似若差升者標諸頂上不敢輒改彼全是者巨細悉皆標之彼全誤者槩弗取兩可難裁者則亦舉之使以知異同覽者其察諸嗟乎記之為釋使學者知文字與解脫可以即而不即可以不即而即膏火相助經疏之宗而用即即之不即永免説食數寶之支不即不即之即高超暗證無聞之狂不即不離二病互救之妙焉則窺測其實難哉其或不藉記解者不支則狂不狂則支則窺測其實不難哉偉矣記也救弊正偏羽翼斯道此蓋吾宗看教之常亡適不然記旨特在于此誰難乎知常而常之言末之難矣末之難矣唯是為難矣非知常之言難實得乎心之難者籍記解者終令難者難而不知其近在己不難也則窺測其果難邪其果不難邪元文丁巳臘月朔天台山南溪寶積教院沙門清求妙乘謹撰維摩經疏記序原夫三才方判一氣生於道上三春殆回一陽復乎地中三軸將行一卷顯于格下此世出世間自然之數也蓋荊溪述作之為維摩疏記也固有三卷廣大悉備有三諦焉有三觀焉有三千焉一代時教八萬法藏卷懷同在一性一心一念巾帙觀心為經諸法為緯織成部袟不與他同斯之謂也廣矣大矣不可得而思也嘗稽羣書疏有廣略者各從機宜所好也記有衆寡者蓋由後人析卷也通慧僧傳所載略維摩疏十卷維摩疏記三卷雖無廣言而對上略下的指廣是以孤山垂裕敘於疏三十四卷記三卷疏廣記略所由而出後學執廣疏記尋繹略疏文義回互慈雲函録舉略疏十卷廣疏記六卷竟云記對廣疏指文少殊釋義宛合東湖統紀荊溪本紀列出略疏十卷記三卷廣疏記六卷其三卷似略疏記而至山家教典志不載於記三卷舉廣疏記六卷紀之與志何自反也睿山證真雖不載數而決記主云妙樂記消廣疏道暹記釋略疏由是觀之荊溪不記略疏明矣至其編數但是開合異耳何其致疑惑焉猶言兼三才而兩之故六六者非他也三才之道也又由一月分為白黑則三春月成六數也夫一心者萬法之總也分為戒定慧三學開而為檀那等六度也義真座主撰維摩堂記云不經三祇頓滿薩埵之行不逾一念直進遮那之果三身究竟無有過上良以淨即真身名即應身真即所證之理應即所現之身一體三身或時分為理智自他勝劣六身或時一一文字皆現金粟如來今斯記數不是妙乎厥天台廣疏我孝謙御寓鑑真和尚帶來東大傳教大師寫得南京請益巨唐而傳荊溪之記復命本朝以置睿嶽之藏是故慈雲云唐時有日本國僧最澄多取教卷往於彼國惜乎諸説今無得而聞焉嗟夫教有夷隆書有隱顯非惟震旦日域亦爾廣疏與記韜晦于世不知幾載今夏曬陳編於螢雪軒時偶從書架下敞篋蠹簡中得茲首篇不禁踊躍方思繡梓以公同好會書商主齎一故策來謂余曰某有願刻維摩妙記旁叩諸剎求未應手屬推洛北禪門如落樞臼不勞獲焉雖卷不完鋟木流行以為他日擊發希聲之一椎耳庶蒙倭訓并一校焉余聞領之啓卷頂讀菩薩品去記而性具法門昭昭乎若大明麗天置書几案語曰夫壽書木也者莫良於梓百木長故梓為木王董子所謂古之造文字者三畫而貫其中者謂之王三畫者天地與人也而連其中通其道也為是義故我山王明神曰我名山王表三諦即一也山字豎三畫者空假中也橫一畫是即一也王字橫三畫者三諦也豎一畫又一也二字三畫而有一貫之象故我立為號也一心三觀一念三千亦復如是是以我護持台教鎮覆國家云云伯陽又有言道生一一生二二生三此必然之理也我貯斯記一册今方生二聖語信有徵矣兩加點較共𢍉於子異日會當成三全本流布天下商主大喜而去自時厥後且點且較時時與夫關中注解方以融即匹以圓理豈得同日語其優劣智者大師不言乎若尋什師生肇注維摩同用通意陳梁諸法師講此經文今家往望皆是用通教意釋此經耳聖師之語豈虗也哉是以寶雲道威云四注淨名既將己見注釋佛經猶難取信今則不然深可取信依憑有在者即智者大禪師疏也月柏庭亦云所謂什肇釋經多附通意雖得通意之權而失圓頓之實苟為失實則權實俱非斯言至矣哉緬懷有隋煬帝潛龍之時閣什肇注請智者疏大師滅後向疏呪願夢感智者有悟疏旨以故逮登儲二宣令慧日道場道莊法論二師於東宮講淨名不據關注全用台疏判釋經文副君臨聽以為心要弘通宇內天挺睿智深哉朗矣加旃華嚴六祖大統清涼國師性自天然解從上智才供二筆目視九行大曆十年習學天台止觀法華維摩等經疏于荊溪大師凡歷唐九朝為七帝門師撰華嚴疏完用天台判教相文及三觀三德一念三千性善性惡等又宜矣乎繇是皇明宋濂著華嚴古庭法師塔銘云清涼大士學無常師習維摩等疏于荊溪賢首之學雜華為尊至若天台性善性惡三觀三德之旨一念三千之文又曷嘗不引之而示人況修門之注釋乃止觀熏習次第亦不外之實惟吾祖智者妙談解行所以抗折百家獨拔兩朝者以由三千性惡法門故也雖然陽春白雪唱高和寡義疏雖存而隱不行吾甚傷之今時講釋維摩者衆升座握塵辨河馳電談玄説妙不過什肇通意惡知今宗圓具豈不見無盡燈師云肇公觀談雖善苟不明乎性具亦恐有言而無旨也肇師聖智尚爾況叔世淺識乎故荊溪云忽都未聞性惡之名安能信有性德之行弗知天台性惡融通寂滅魔界即佛之理濫唱毗耶煩惱即菩提生死即涅槃之説非但墮鼠唧鳥空之責誚抑亦為衆魔羣道之嬈固吁可畏者其在茲焉點藁既成投其書肆乃使筆生淨寫登梓將得一序以安篇端俾人起信頻請不已因拭老眼呵硯冰而敘疏記顯晦之顛末云耳時元祿龍輯重光大荒落律中黃鍾月念有四蓂台宗沙門秀雲筆于睿岫西塔東溪螢雪軒之寓居
